- name: Add repositories
  deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.url }}"
    architectures: "{{ item.architectures|default(omit) }}"
    components: "{{ item.components|default(omit) }}"
    suites: "{{ item.suites|default(omit) }}"
    signed_by: "{{ item.apt_key_url }}"
  with_items: "{{ hardening.apt_repositories }}"

- name: install required packages
  apt:
    name: "{{ hardening.apt_packages }}"
    update_cache: yes
    state: present

- name: create required directories
  file:
    name: "{{ vaultwarden.data_directory }}"
    mode: "700"
    owner: "vaultwarden"
    group: "vaultwarden"
    state: directory

- name: generate configuration files
  template:
    src: "{{ item.name }}.j2"
    dest: "{{ item.path }}/{{ item.name }}"
    owner: "{{ item.owner|default(omit) }}"
    group: "{{ item.group|default(omit) }}"
    mode: "{{ item.mode|default(omit) }}"
  with_items:
    - name: homelab.conf
      path: /etc/fail2ban/jail.d
    - name: matrix-synapse.conf
      path: /etc/fail2ban/filter.d
    - name: keycloak.conf
      path: /etc/fail2ban/filter.d
    - name: vaultwarden.conf
      path: /etc/fail2ban/filter.d
    - name: vaultwarden.env
      path: /etc/vaultwarden
