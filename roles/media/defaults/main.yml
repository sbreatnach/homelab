lastfm:
  api_key: dummy
  secret: dummy
media:
    localfm:
      application_secret: dummy
      allowed_hosts: localhost,localfm.nas.home,localfm.nas.vpn
      db:
        host: localhost
        port: 5432
        name: localfm
        user: localfm
        password: localfm
    users:
        calibre:
            shell: /bin/bash
        localfm:
            shell: /bin/bash
            create_home: true
        photoview:
            shell: /bin/bash
        ytdlpwebui:
            shell: /bin/bash
    directories:
        music: /var/lib/mpd/music
        video: /var/lib/video
        navidrome: /opt/navidrome
        calibre: /opt/calibre
        localfm: /opt/localfm
        photoview: /opt/photoview
        ytdlpwebui: /opt/ytdlpwebui
    python_libraries:
        - repo: https://github.com/janeczku/calibre-web.git
          version: "0.6.27"
          name: calibre-web
          directory_key: calibre
          owner: calibre
          extra_dependencies:
            - python3-ldap
            - python3-nh3
        - repo: https://github.com/sbreatnach/localfm.git
          package_manager: uv
          version: "67a731d54420a89ed55ea29917003763b39290c6"
          name: localfm
          directory_key: localfm
          owner: localfm
          extra_dependencies: []
    package_directories:
        - directory_key: calibre
          owner: calibre
        - directory_key: localfm
          owner: localfm
        - directory_key: photoview
          owner: photoview
    prebuilt_binaries:
        - url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp_linux
          dest: /usr/local/bin/yt-dlp
          checksum: "sha256:6bbb3d314cde4febe36e5fa1d55462e29c974f63444e707871834f6d8cc210ae"
        - url: https://github.com/marcopeocchi/yt-dlp-web-ui/releases/download/v4.0.0/yt-dlp-webui_linux-amd64
          dest: /opt/ytdlpwebui/ytdlpwebui
          checksum: "sha256:144b362169534a2d0c221f62acaa09eb999adfa29e33e6e87e5f9f8e99d2cc92"
    binary_archives:
        - url: https://github.com/navidrome/navidrome/releases/download/v0.63.2/navidrome_0.63.2_linux_amd64.tar.gz
          dest: /opt/navidrome
        - url: https://github.com/sbreatnach/photoview/releases/download/v2.4.0/photoview_v2.4.0_linux_amd64.tar.gz
          dest: /opt/photoview
    apt_repositories:
        - name: audiobookshelf
          url: https://advplyr.github.io/audiobookshelf-ppa
          suites: "./"
          apt_key_url: https://advplyr.github.io/audiobookshelf-ppa/KEY.gpg
    apt_packages:
        - name: mpd
        - name: ffmpeg
        - name: audiobookshelf
        - name: calibre
          install_recommends: false
    java_packages: []
    java_home: /usr/lib/jvm/java-11-openjdk-amd64
    deb_packages:
        - path: https://github.com/MediaBrowser/Emby.Releases/releases/download/4.9.1.80/emby-server-deb_4.9.1.80_amd64.deb
        - path: https://github.com/badaix/snapcast/releases/download/v0.35.0/snapserver_0.35.0-1_amd64_trixie.deb
